      #     cat <<EOF > ../.env
      #     OPENAI_API_KEY=${OPENAI_API_KEY}
      #     ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      #     GEMINI_API_KEY=${GEMINI_API_KEY}
      #     EOF
      #     uv run pytest tests/integration/ -v -m integration
      #   working-directory: 04_multi_provider
